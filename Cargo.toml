[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ruoyi_rust_prod"
path = "src/main.rs"

[[bin]]
name = "ruoyi_rust_dev"
path = "src/main.rs"

#本系统设置为 postgresql
[features]
default = ["postgresql"]
postgresql = []
# tls-rustls=["rbdc/tls-rustls"]
# tls-native-tls=["rbdc/tls-native-tls"]
plc_gateway_xlsx = ["calamine", "xlsxwriter"]
plc_gateway = ["axum/multipart"]
[dependencies]
actix = "0.13"
actix-tls = "3.4"
actix-utils = "3"
actix-web = "4.11"
actix-cors = "0.7"
actix-http = "3.11"
actix-multipart = "0.7"
actix-files = "0.6"
actix-ws = "0.3"
actix-web-validator = "6.0.0"
validator ={ version = "0.18", features = ["derive"] } #加入验证框架 "0.18.1"
jsonwebtoken = "9.3.0"
captcha = "0.0.9"
image = "0.25.2"
# bcrypt = "0.15.1" # 由于 bcrypt 加密运行比较慢 已用 下面 rust-crypto 替换
rust-crypto = "0.2.36"
async-std = "1.13.0"
rbs = { version = "4.6"}
rbatis = { version = "4.6.15"}
rbdc-pg = {version="4.6"}
# rbatis = { version = "4.6",features = ["debug_mode"]}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.33"
merge-yaml-hash = "0.4.0"
fastdate = { version = "0.3" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.12"
tokio-stream = "0.1.16"
once_cell = "1.20.2"
futures-util = "0.3.31"
redis = "0.29.1"
parking_lot = "0.12.3"
uuid = "1.10.0"
url = "2.5.2"
chrono = "0.4.38"
user-agent-parser = "0.3.6"
base64 = "0.22.1"
argon2 = "0.5"
bytesize = "1.3.0"
log = "0.4.22"
fast_log = "1.7.4"
sysinfo = "0.28.2"
permit-lib = { path = "./permit-lib" }
pinyin = "0.10.0"
anyhow = "1.0.100"
rumqttc = "0.25.1"
either = "1.15.0"
# actix-web-actors = "4.3.1"
umya-spreadsheet = "1.1"
netcore = { path = "./src/netcore" }
DEVICE_PROTO = { path = "./core/dev_protocols/device_proto" }
axum = "0.7"
dashmap = "5.5"
env_logger = "0.10"
urlencoding = "2.1"
yaml-rust = "0.4.5"
md5 = "0.8.0"
config = "0.15.15"
flexi_logger = "0.31.2"
sea-orm = { version = "1.1.15", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sqlx = "0.8.6"
lazy_static = "1.5.0"
thiserror = "2.0.17"
calamine = { version = "0.31.0", optional = true }
xlsxwriter = { version = "0.6.1", optional = true }
reqwest = { version = "0.12.22", features = ["json"] }
