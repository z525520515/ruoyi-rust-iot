[package]
name = "permit-lib"
version = "0.1.0"
edition = "2021"
description = "轻量级权限校验宏（permit-lib）"
license = "MIT"
repository = "https://github.com/z525520515/ruoyi-rust-iot"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
proc-macro = true
path = "src/lib.rs"

[dependencies]
syn = { version = "1.0", features = ["full", "derive", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

