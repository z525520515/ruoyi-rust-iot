[package]
name = "DEVICE_PROTO"
version = "1.0.0"
edition = "2024"
description = "Device frame protocol codec library (device data parsing)"
license = "MIT"
repository = "https://github.com/z525520515/ruoyi-rust-iot"

[dependencies]
byteorder = "1.5"
bytes = "1.11.0"
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10.4"
either = { version = "1.15.0", features = ["serde"] }
fixedbitset = "0.5.7"
once_cell = "1.21.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[[example]]
name = "s909_examples_doc"
path = "examples/s909_examples.rs"

[[example]]
name = "dev_frame_example_doc"
path = "examples/dev_frame_example.rs"

[[example]]
name = "control_request_doc"
path = "examples/control_request_example.rs"
