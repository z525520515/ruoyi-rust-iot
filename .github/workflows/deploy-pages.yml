name: Deploy Web Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ruoyi-vue3-rust-master/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ruoyi-vue3-rust-master/package-lock.json

      - name: Show tool versions
        working-directory: ruoyi-vue3-rust-master
        run: |
          node -v
          npm -v

      - name: Install dependencies
        working-directory: ruoyi-vue3-rust-master
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build demo
        working-directory: ruoyi-vue3-rust-master
        env:
          # GitHub Pages 部署在 /<仓库名>/ 子路径下
          VITE_APP_BASE: /${{ github.event.repository.name }}/
        run: npm run build:demo

      - name: Add SPA fallback and .nojekyll
        working-directory: ruoyi-vue3-rust-master
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      # 首次运行时可自动启用 GitHub Pages（需要在仓库 Settings 中允许 Actions 部署）
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ruoyi-vue3-rust-master/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
