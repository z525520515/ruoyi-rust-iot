[package]
name = "netcore"
version = "0.1.0"
edition = "2021"
description = "High-performance async TCP framework inspired by Netty"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1.0"
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
